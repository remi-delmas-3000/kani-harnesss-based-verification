[package]
name = "kani-harnesss-based-verification"
version = "0.1.0"
edition = "2024"

[dependencies]
bolero = "0.13.2"
bolero-generator = "0.13.2"

[package.metadata.kani.flags]
enable-unstable = true
unstable = "c-ffi"
c-lib = "src/havoc_object_u8.c"

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
